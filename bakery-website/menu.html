<!DOCTYPE html>

<body>

<header>
  <div class="logo">こもれびベーカリー</div>
  <nav>
    <a href="index.html">ホーム</a>
    <a href="menu.html">メニュー</a>
    <a href="index.html#access">店舗案内</a>
  </nav>
</header>

<main>

  <section class="menu-hero">
    <h1 class="menu-title">メニュー</h1>
    <p class="menu-sub">毎日の食卓にそっと寄りそう、やさしいパンたち。</p>
  </section>

  <section class="menu-list">

    <div class="menu-item">
      <img src="2.shokupan.png" alt="もちもち食パン" class="menu-img">
      <h2 class="menu-name">もちもち食パン</h2>
      <p class="menu-desc">
        国産小麦と自家製酵母で仕込んだ、<br>
        しっとりもちもちの食パン。<br>
        トーストすると小麦の甘さがふわっと広がります。
      </p>
    </div>

    <div class="menu-item">
      <img src="3.kurumi.png" alt="くるみパン" class="menu-img">
      <h2 class="menu-name">くるみパン</h2>
      <p class="menu-desc">
        ローストしたくるみをたっぷり混ぜ込んだ、<br>
        香ばしい人気のパン。
      </p>
    </div>

    <div class="menu-item">
      <img src="4.danish.png" alt="季節のフルーツデニッシュ" class="menu-img">
      <h2 class="menu-name">季節のフルーツデニッシュ</h2>
      <p class="menu-desc">
        旬のフルーツをのせたサクサクのデニッシュ。<br>
        季節ごとに内容が変わります。
      </p>
    </div>

    <div class="menu-item">
      <img src="5.minipan.png" alt="ミニパンシリーズ" class="menu-img">
      <h2 class="menu-name">ミニパンシリーズ</h2>
      <p class="menu-desc">
        小さな手にも持ちやすい、ひとくちサイズのパン。<br>
        お子さまにも人気です。
      </p>
    </div>

  </section>

</main>

<footer>
  <p>© こもれびベーカリー</p>
