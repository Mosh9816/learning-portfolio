<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>顧客一覧</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        .text-purple {
            color: #6f42c1;
        }
    </style>
</head>
<body class="p-4">

<h2>顧客一覧</h2>

<!-- 🔍 検索フォーム -->
<form action="/customers/search" method="get" class="mt-3 mb-3">
    <div class="input-group">
        <input type="text" name="keyword" class="form-control" placeholder="名前・メール・ステータスで検索">
        <button class="btn btn-primary" type="submit">検索</button>
    </div>
</form>

<!-- 🎯 ステータス絞り込み（ここを追加） -->
<div class="mb-3">
    <a href="/customers/filter?status=見込み" class="btn btn-outline-primary btn-sm">見込み</a>
    <a href="/customers/filter?status=アプローチ中" class="btn btn-outline-secondary btn-sm">アプローチ中</a>
    <a href="/customers/filter?status=商談中" class="btn btn-outline-warning btn-sm">商談中</a>
    <a href="/customers/filter?status=見積提示" class="btn btn-outline-success btn-sm">見積提示</a>
    <a href="/customers/filter?status=成約" class="btn btn-outline-success btn-sm">成約</a>
    <a href="/customers/filter?status=失注" class="btn btn-outline-dark btn-sm">失注</a>
</div>

<!-- 🔙 検索 or フィルタ後のみ表示される戻るボタン -->
<a href="/customers" class="btn btn-outline-secondary btn-sm mb-3"
   th:if="${keyword != null or selectedStatus != null}">一覧に戻る</a>

<a href="/dashboard" class="btn btn-secondary btn-sm">ダッシュボード</a>
<a href="/customers/new" class="btn btn-success btn-sm ms-3">新規追加</a>

<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>ID</th>
            <th>名前</th>
            <th>メール</th>
            <th>電話</th>
            <th>ステータス</th>
            <th>次回アクション日</th>
            <th>メモ</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="c : ${customers}">
            <td th:text="${c.id}"></td>

            <td>
                <a th:href="@{'/customers/' + ${c.id}}" th:text="${c.name}"></a>
            </td>

            <td th:text="${c.email}"></td>
            <td th:text="${c.phone}"></td>

            <!-- ★ ステータス色分け -->
            <td th:text="${c.status}"
                th:classappend="${c.status == '見込み' ? 'text-primary fw-bold' :
                                 c.status == 'アプローチ中' ? 'text-purple fw-bold' :
                                 c.status == '商談中' ? 'text-warning fw-bold' :
                                 c.status == '見積提示' ? 'text-success fw-bold' :
                                 c.status == '成約' ? 'text-success fw-bold' :
                                 c.status == '失注' ? 'text-secondary fw-bold' : ''}">
            </td>

            <!-- ★ 次回アクション日（今日・過去なら赤） -->
            <td th:text="${c.nextActionDate} ?: '未設定'"
                th:classappend="${c.nextActionDate != null and c.nextActionDate <= T(java.time.LocalDate).now()} ? 'text-danger fw-bold' : ''">
            </td>

            <td th:text="${#strings.abbreviate(c.memo, 20)}"></td>

            <td>
                <a th:href="@{'/customers/edit/' + ${c.id}}" class="btn btn-primary btn-sm me-1">編集</a>
                <form th:action="@{'/customers/delete/' + ${c.id}}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('本当に削除しますか？');">削除</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
