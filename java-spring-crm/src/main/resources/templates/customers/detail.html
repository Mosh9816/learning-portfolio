<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>顧客詳細</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

<h2>顧客詳細</h2>

<div class="card p-3 mb-4">
    <p><strong>ID:</strong> <span th:text="${customer.id}"></span></p>
    <p><strong>名前:</strong> <span th:text="${customer.name}"></span></p>
    <p><strong>メール:</strong> <span th:text="${customer.email}"></span></p>
    <p><strong>電話:</strong> <span th:text="${customer.phone}"></span></p>
    <p><strong>ステータス:</strong> <span th:text="${customer.status}"></span></p>
</div>

<!-- ★ メモ表示 ★ -->
<h4>メモ</h4>
<div class="border p-2 mb-3" th:text="${customer.memo}">メモなし</div>

<!-- ★ メモ編集フォーム ★ -->
<form th:action="@{'/customers/update-memo/' + ${customer.id}}" method="post">
    <textarea class="form-control" name="memo" rows="4"
              th:text="${customer.memo}"></textarea>
    <button class="btn btn-primary mt-2">メモを更新</button>
</form>

<hr class="my-4">

<!-- ★ 次回アクション日（表示） ★ -->
<h4>次回アクション日</h4>
<p>
    <strong>現在の設定:</strong>
    <span th:text="${customer.nextActionDate}">未設定</span>
</p>

<!-- ★ 次回アクション日 編集フォーム ★ -->
<form th:action="@{'/customers/update-next/' + ${customer.id}}" method="post">
    <input type="date" name="nextActionDate" class="form-control"
           th:value="${customer.nextActionDate}">
    <button class="btn btn-primary mt-2">次回アクション日を更新</button>
</form>

<hr class="my-4">

<!-- ★ ステータス変更フォーム ★ -->
<h4>ステータス変更</h4>

<p><strong>現在のステータス:</strong>
    <span th:text="${customer.status}"></span>
</p>

<form th:action="@{'/customers/update-status/' + ${customer.id}}" method="post">
    <select name="status" class="form-select">
        <option value="見込み" th:selected="${customer.status == '見込み'}">見込み</option>
        <option value="アプローチ中" th:selected="${customer.status == 'アプローチ中'}">アプローチ中</option>
        <option value="商談中" th:selected="${customer.status == '商談中'}">商談中</option>
        <option value="見積提示" th:selected="${customer.status == '見積提示'}">見積提示</option>
        <option value="成約" th:selected="${customer.status == '成約'}">成約</option>
        <option value="失注" th:selected="${customer.status == '失注'}">失注</option>
    </select>

    <button class="btn btn-primary mt-2">ステータスを更新</button>
</form>

<!-- ★ 一覧に戻る（ページの一番下へ移動） ★ -->
<a th:href="@{/customers}" class="btn btn-secondary mt-4">一覧に戻る</a>

</body>
</html>
